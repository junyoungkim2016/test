<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>슬림 냉온정 직수 정수기 비교 플랫폼</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', -apple-system, BlinkMacSystemFont, sans-serif; }
    body { background-color: #f8fafc; color: #1e293b; line-height: 1.5; }
    header { background: #0f172a; color: #fff; padding: 2.5rem 1.5rem; text-align: center; }
    header h1 { font-size: 1.75rem; margin-bottom: 0.5rem; }
    header p { color: #94a3b8; font-size: 0.95rem; }
    .container { max-width: 1080px; margin: 0 auto; padding: 2rem 1rem; }
    .control-panel { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; background: #fff; padding: 1.2rem; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 1.5rem; }
    .mode-tabs { display: flex; gap: 0.5rem; background: #f1f5f9; padding: 0.3rem; border-radius: 8px; }
    .tab-btn { padding: 0.5rem 1rem; border: none; border-radius: 6px; font-weight: 600; cursor: pointer; background: transparent; color: #64748b; transition: all 0.2s; }
    .tab-btn.active { background: #0284c7; color: #fff; }
    .filter-group { display: flex; gap: 1rem; align-items: center; flex-wrap: wrap; font-size: 0.9rem; }
    .filter-group label { display: flex; align-items: center; gap: 0.4rem; cursor: pointer; }
    .add-box { background: #fff; border: 1px solid #cbd5e1; border-radius: 10px; padding: 1.2rem; margin-bottom: 1.5rem; }
    .add-box h2 { font-size: 1rem; margin-bottom: 0.8rem; color: #0f172a; }
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 0.6rem; }
    .form-grid input { padding: 0.55rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.88rem; width: 100%; }
    .btn-primary { background: #0284c7; color: #fff; border: none; border-radius: 6px; padding: 0.55rem 1rem; font-weight: 600; cursor: pointer; }
    .btn-primary:hover { background: #0369a1; }
    .table-wrap { overflow-x: auto; background: #fff; border-radius: 10px; border: 1px solid #e2e8f0; margin-bottom: 2rem; }
    table { width: 100%; border-collapse: collapse; text-align: center; min-width: 720px; }
    th, td { padding: 1rem 0.75rem; border-bottom: 1px solid #e2e8f0; font-size: 0.93rem; }
    th { background: #f8fafc; font-weight: 600; color: #334155; }
    td:first-child, th:first-child { text-align: left; font-weight: 600; background: #f1f5f9; width: 140px; min-width: 140px; }
    .brand-tag { font-size: 0.78rem; color: #0284c7; font-weight: 700; display: block; }
    .model-name { font-size: 1.05rem; font-weight: 700; color: #0f172a; display: block; margin: 0.2rem 0; }
    .del-btn { background: #fee2e2; color: #dc2626; border: none; padding: 0.2rem 0.5rem; border-radius: 4px; font-size: 0.75rem; cursor: pointer; margin-top: 0.3rem; }
    .price-highlight { font-size: 1.05rem; font-weight: 700; color: #0284c7; }
    .badge { display: inline-block; padding: 0.2rem 0.5rem; background: #e0f2fe; color: #0369a1; border-radius: 4px; font-size: 0.8rem; font-weight: 600; }
    .calc-card { background: #fff; padding: 1.5rem; border-radius: 10px; border: 1px solid #e2e8f0; }
    .calc-card h2 { font-size: 1.15rem; margin-bottom: 1rem; }
    .calc-controls { display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; margin-bottom: 1rem; }
    select, input[type="number"] { padding: 0.55rem; border: 1px solid #cbd5e1; border-radius: 6px; font-size: 0.93rem; }
    .calc-result { background: #f0f9ff; border: 1px solid #bae6fd; padding: 1.2rem; border-radius: 8px; font-size: 1rem; }
    .calc-result strong { color: #0284c7; font-size: 1.2rem; }
  </style>
</head>
<body>
<header>
  <h1>슬림 냉온정 직수 정수기 비교 사이트</h1>
  <p>일시불 자가관리 vs 렌탈 비용 비교 및 맞춤형 모델 스펙 분석</p>
</header>
<div class="container">
  <div class="control-panel">
    <div class="mode-tabs">
      <button class="tab-btn active" id="tabLump" onclick="setMode('lump')">일시불 자가관리 기준</button>
      <button class="tab-btn" id="tabRental" onclick="setMode('rental')">자가관리 렌탈 기준</button>
    </div>
    <div class="filter-group">
      <label><input type="checkbox" id="chkSlim" onchange="render()"> 가로 폭 17cm 이하만 보기</label>
      <button class="del-btn" style="background:#e2e8f0; color:#334155;" onclick="resetData()">기본 목록 초기화</button>
    </div>
  </div>

  <div class="add-box">
    <h2>+ 비교 모델 직접 추가하기</h2>
    <div class="form-grid">
      <input type="text" id="inBrand" placeholder="브랜드 (예: 쿠쿠)">
      <input type="text" id="inName" placeholder="모델명 (예: 인스퓨어 100도)">
      <input type="number" id="inWidth" step="0.1" placeholder="가로 폭 cm (예: 16.6)">
      <input type="number" id="inLump" placeholder="일시불가 원 (예: 1150000)">
      <input type="number" id="inFilter" placeholder="연 필터비 원 (예: 80000)">
      <input type="number" id="inRental" placeholder="월 렌탈료 원 (예: 27900)">
      <input type="text" id="inSpec" placeholder="주요 기능 (예: 100도 온수, UV)">
      <button class="btn-primary" onclick="addModel()">비교표에 추가</button>
    </div>
  </div>

  <div class="table-wrap"><table id="compareTable"></table></div>

  <div class="calc-card">
    <h2>사용 기간별 총유지비 비교 (일시불 vs 렌탈)</h2>
    <div class="calc-controls">
      <select id="calcSelect" onchange="calculate()"></select>
      <label>사용 약정/기간:
        <select id="calcYears" onchange="calculate()">
          <option value="3">3년 (36개월)</option>
          <option value="5" selected>5년 (60개월)</option>
          <option value="6">6년 (72개월)</option>
        </select>
      </label>
    </div>
    <div class="calc-result" id="calcResult"></div>
  </div>
</div>

<script>
const initialData = [
  { id: 1, brand: "코웨이", name: "아이콘 정수기 3", width: 18.0, lumpPrice: 1290000, yearlyFilter: 90000, rentalMonthly: 29900, temp: "냉수 · 온수(100도) · 정수", care: "UV 살균 + 셀프 필터 교체" },
  { id: 2, brand: "SK매직", name: "초소형 플러스 직수", width: 16.4, lumpPrice: 1190000, yearlyFilter: 85000, rentalMonthly: 28900, temp: "냉수 · 온수 · 정수", care: "전해수 + UV 안심케어" },
  { id: 3, brand: "LG전자", name: "퓨리케어 오브제컬렉션", width: 17.0, lumpPrice: 1250000, yearlyFilter: 95000, rentalMonthly: 30900, temp: "냉수 · 온수 · 정수", care: "고온 살균 + 무빙 출수탭" }
];

let viewMode = 'lump';
let models = JSON.parse(localStorage.getItem('slimHotColdPurifiers')) || [...initialData];

function save() { localStorage.setItem('slimHotColdPurifiers', JSON.stringify(models)); }

function setMode(mode) {
  viewMode = mode;
  document.getElementById('tabLump').classList.toggle('active', mode === 'lump');
  document.getElementById('tabRental').classList.toggle('active', mode === 'rental');
  render();
}

function addModel() {
  const brand = document.getElementById('inBrand').value.trim() || "기타";
  const name = document.getElementById('inName').value.trim();
  const width = parseFloat(document.getElementById('inWidth').value);
  const lumpPrice = parseInt(document.getElementById('inLump').value, 10) || 0;
  const yearlyFilter = parseInt(document.getElementById('inFilter').value, 10) || 0;
  const rentalMonthly = parseInt(document.getElementById('inRental').value, 10) || 0;
  const care = document.getElementById('inSpec').value.trim() || "직수형 / 자가관리";
  if (!name || isNaN(width)) { alert("모델명과 가로 폭(cm)은 필수 입력 사항입니다."); return; }
  models.push({ id: Date.now(), brand, name, width, lumpPrice, yearlyFilter, rentalMonthly, temp: "냉수 · 온수 · 정수", care });
  ['inBrand','inName','inWidth','inLump','inFilter','inRental','inSpec'].forEach(id => document.getElementById(id).value = '');
  save();
  render();
}

function removeModel(id) {
  models = models.filter(m => m.id !== id);
  save();
  render();
}

function resetData() {
  if (confirm("기본 3종 모델로 초기화하시겠습니까?")) {
    models = [...initialData];
    save();
    document.getElementById('chkSlim').checked = false;
    render();
  }
}

function escapeHtml(value) {
  return String(value).replace(/[&<>'"]/g, char => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', "'":'&#39;', '"':'&quot;' }[char]));
}

function render() {
  const onlySlim = document.getElementById('chkSlim').checked;
  const list = models.filter(m => !onlySlim || m.width <= 17.0);
  const table = document.getElementById('compareTable');

  if (list.length === 0) {
    table.innerHTML = `<tr><td style="text-align:center; padding:2rem;">조건에 맞는 모델이 없습니다.</td></tr>`;
  } else {
    let html = `<thead><tr><th>비교 항목</th>`;
    list.forEach(m => {
      html += `<th><span class="brand-tag">${escapeHtml(m.brand)}</span><span class="model-name">${escapeHtml(m.name)}</span><button class="del-btn" onclick="removeModel(${m.id})">삭제 ×</button></th>`;
    });
    html += `</tr></thead><tbody>`;

    const rows = [
      { label: "가로 폭", val: m => `<span class="badge">${m.width} cm</span>` },
      { label: "출수 온도", val: m => escapeHtml(m.temp) },
      { label: viewMode === 'lump' ? "일시불 기기가격" : "월 렌탈료 (자가관리)", val: m => viewMode === 'lump' ? `<span class="price-highlight">${m.lumpPrice.toLocaleString()}원</span>` : `<span class="price-highlight">월 ${m.rentalMonthly.toLocaleString()}원</span>` },
      { label: viewMode === 'lump' ? "연간 필터 유지비" : "5년 렌탈 총액", val: m => viewMode === 'lump' ? `약 ${m.yearlyFilter.toLocaleString()}원 / 년` : `약 ${(m.rentalMonthly * 60).toLocaleString()}원` },
      { label: "위생 및 특징", val: m => escapeHtml(m.care) }
    ];

    rows.forEach(r => {
      html += `<tr><td>${r.label}</td>`;
      list.forEach(m => html += `<td>${r.val(m)}</td>`);
      html += `</tr>`;
    });
    html += `</tbody>`;
    table.innerHTML = html;
  }

  const select = document.getElementById('calcSelect');
  const previous = select.value;
  select.innerHTML = models.map(m => `<option value="${m.id}">${escapeHtml(m.brand)} ${escapeHtml(m.name)}</option>`).join('');
  if (models.some(m => String(m.id) === previous)) select.value = previous;
  calculate();
}

function calculate() {
  const id = Number(document.getElementById('calcSelect').value);
  const model = models.find(m => m.id === id);
  if (!model) {
    document.getElementById('calcResult').innerHTML = "모델을 추가하거나 기본 목록을 초기화해 주세요.";
    return;
  }
  const years = Number(document.getElementById('calcYears').value);
  const months = years * 12;
  const lumpTotal = model.lumpPrice + model.yearlyFilter * years;
  const rentalTotal = model.rentalMonthly * months;
  const difference = lumpTotal - rentalTotal;
  const cheaper = difference > 0 ? "일시불 자가관리" : "자가관리 렌탈";
  const amount = Math.abs(difference).toLocaleString();

  document.getElementById('calcResult').innerHTML = `
    <strong>${escapeHtml(model.brand)} ${escapeHtml(model.name)}</strong><br>
    ${years}년 기준 일시불 자가관리 총비용: <strong>${lumpTotal.toLocaleString()}원</strong><br>
    ${years}년 기준 렌탈 총비용: <strong>${rentalTotal.toLocaleString()}원</strong><br>
    결과: <strong>${cheaper}</strong>가 약 ${amount}원 더 저렴합니다.
  `;
}

render();
</script>
</body>
</html>
